    </linearGradient>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#374151"/>
      <stop offset=".55" stop-color="#111827"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <pattern id="grille" width="14" height="14" patternUnits="userSpaceOnUse">
